<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Arrowly - Tap Puzzle</title>
<style>
  :root{
    --bg-top:#EAF6FF;
    --bg-bottom:#FDF6FF;
    --ink:#25324B;
    --card:#FFFFFF;
    --up:#FF6B6B;
    --down:#06B6D4;
    --left:#FFB020;
    --right:#7C5CFF;
    --success:#2ECC71;
    --muted:#C7CEDC;
    --shadow: 0 6px 16px rgba(37,50,75,0.12);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent; user-select:none;}
  html,body{
    margin:0; padding:0; height:100%;
    font-family: -apple-system, "SF Pro Rounded", "Nunito", "Segoe UI", Roboto, sans-serif;
    background: radial-gradient(circle at 50% 0%, var(--bg-top), var(--bg-bottom) 70%);
    color: var(--ink);
    overflow:hidden;
  }
  .screen{
    display:none;
    height:100%; width:100%;
    flex-direction:column; align-items:center;
  }
  .screen.active{display:flex;}

  /* ---------- HOME SCREEN ---------- */
  #homeScreen{
    justify-content:center;
    padding:24px;
    position:relative;
    overflow:hidden;
  }
  .floatArrow{
    position:absolute;
    width:46px; height:46px;
    opacity:0.18;
    clip-path: polygon(50% 4%, 88% 44%, 66% 44%, 66% 96%, 34% 96%, 34% 44%, 12% 44%);
  }
  .home-logo{
    width:110px; height:110px;
    border-radius:30px;
    background: linear-gradient(145deg, var(--right), var(--down));
    display:flex; align-items:center; justify-content:center;
    box-shadow: var(--shadow);
    margin-bottom:18px;
  }
  .home-logo .arrow-icon{ width:44px; height:44px; background:#fff;
    clip-path: polygon(50% 4%, 88% 44%, 66% 44%, 66% 96%, 34% 96%, 34% 44%, 12% 44%);
    transform: rotate(90deg);
  }
  .home-title{ font-size:34px; font-weight:900; letter-spacing:-1px; margin:0; text-align:center;}
  .home-title span{ color:var(--right);}
  .home-sub{ color:#8892A6; font-weight:700; margin:4px 0 30px; text-align:center; font-size:14px;}
  .home-actions{ width:100%; max-width:320px; display:flex; flex-direction:column; gap:12px;}
  .home-btn{
    border:none; border-radius:16px; padding:16px; font-weight:800; font-size:16px;
    cursor:pointer; box-shadow: var(--shadow); text-align:center;
  }
  .home-btn.primary{ background: linear-gradient(145deg, var(--right), #a396ff); color:white;}
  .home-btn.secondary{ background: var(--card); color: var(--ink);}
  .home-progress{
    margin-top:22px; background:var(--card); border-radius:16px; padding:12px 18px;
    box-shadow: var(--shadow); font-size:13px; font-weight:700; color:#71798e;
    text-align:center;
  }
  .home-progress b{ color: var(--ink); }

  /* ---------- LEVEL SELECT OVERLAY ---------- */
  #levelOverlay, #overlay{
    position:fixed; inset:0; background:rgba(37,50,75,0.55);
    display:none; align-items:center; justify-content:center; z-index:10;
    padding:20px;
  }
  #levelOverlay.show, #overlay.show{display:flex;}
  .modal{
    background:var(--card); border-radius:22px; padding:26px 22px;
    text-align:center; width:min(360px, 92vw);
    box-shadow: 0 20px 40px rgba(0,0,0,0.25);
    max-height:80vh; overflow-y:auto;
  }
  .modal h2{margin:0 0 6px; font-size:20px;}
  .modal p{margin:0 0 16px; color:#71798e; font-size:14px;}
  .modal .btn{width:100%; margin-top:8px;}
  .level-grid{
    display:grid; grid-template-columns: repeat(4, 1fr); gap:10px; margin:6px 0 4px;
  }
  .level-node{
    aspect-ratio:1; border-radius:14px; border:none; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    font-weight:800; font-size:15px; color:white;
    background: linear-gradient(145deg, var(--right), #a396ff);
    box-shadow: var(--shadow);
  }
  .level-node.locked{
    background:var(--muted); color:#8892A6; cursor:default; box-shadow:none;
  }
  .level-node.current{ outline: 3px solid var(--success); outline-offset:2px; }
  .closeModalBtn{ margin-top:10px; }

  /* ---------- GAME SCREEN ---------- */
  #gameScreen{ padding: 14px 12px 20px; }
  header{
    width:100%; max-width:480px;
    display:flex; justify-content:space-between; align-items:center;
    margin-bottom:10px; gap:8px;
  }
  .homeBtn{
    background:var(--card); border:none; border-radius:12px; width:40px; height:40px;
    box-shadow: var(--shadow); cursor:pointer; font-size:18px; flex-shrink:0;
  }
  .brand{
    font-size:20px; font-weight:800; letter-spacing:-0.5px; white-space:nowrap;
  }
  .brand span{color:var(--right);}
  .stats{
    display:flex; gap:8px;
  }
  .pill{
    background:var(--card); border-radius:999px; padding:6px 12px;
    box-shadow: var(--shadow); font-weight:700; font-size:13px;
    display:flex; align-items:center; gap:6px;
  }
  .pill small{font-weight:600; color:#8892A6; font-size:10px;}

  #boardWrap{
    flex:1; width:100%; max-width:480px;
    display:flex; align-items:center; justify-content:center;
  }
  #board{
    display:grid;
    gap:6px;
    width:100%;
    aspect-ratio: var(--aspect, 1);
  }
  .cell{
    position:relative;
    border-radius:14px;
  }
  .arrow{
    position:absolute; inset:0;
    border-radius:14px;
    display:flex; align-items:center; justify-content:center;
    box-shadow: var(--shadow);
    border:none;
    cursor:pointer;
    transition: transform .16s ease;
    padding:0;
  }
  .arrow.up{background: linear-gradient(145deg, var(--up), #ff8f8f);}
  .arrow.down{background: linear-gradient(145deg, var(--down), #4fd8e8);}
  .arrow.left{background: linear-gradient(145deg, var(--left), #ffcb66);}
  .arrow.right{background: linear-gradient(145deg, var(--right), #a396ff);}

  .arrow-icon{
    width:46%; height:46%; background:#ffffff;
    clip-path: polygon(50% 4%, 88% 44%, 66% 44%, 66% 96%, 34% 96%, 34% 44%, 12% 44%);
    filter: drop-shadow(0 2px 2px rgba(0,0,0,0.15));
  }
  .arrow-icon.up{transform:rotate(0deg);}
  .arrow-icon.right{transform:rotate(90deg);}
  .arrow-icon.down{transform:rotate(180deg);}
  .arrow-icon.left{transform:rotate(270deg);}

  .arrow:active{transform:scale(0.9);}

  @keyframes shake{
    0%,100%{transform:translateX(0);}
    20%{transform:translateX(-6px) rotate(-4deg);}
    40%{transform:translateX(6px) rotate(4deg);}
    60%{transform:translateX(-4px) rotate(-2deg);}
    80%{transform:translateX(4px) rotate(2deg);}
  }
  .arrow.blocked{animation: shake .35s ease;}

  .arrow.clear-up{transform: translateY(-140%) scale(0.6); opacity:0;}
  .arrow.clear-down{transform: translateY(140%) scale(0.6); opacity:0;}
  .arrow.clear-left{transform: translateX(-140%) scale(0.6); opacity:0;}
  .arrow.clear-right{transform: translateX(140%) scale(0.6); opacity:0;}
  .arrow.leaving{transition: transform .28s ease, opacity .28s ease;}

  footer{
    width:100%; max-width:480px;
    display:flex; justify-content:center; gap:10px;
    margin-top:14px;
  }
  .btn{
    border:none; border-radius:14px; padding:12px 20px;
    font-weight:800; font-size:14px; cursor:pointer;
    box-shadow: var(--shadow);
    background: var(--card); color: var(--ink);
  }
  .btn.primary{
    background: linear-gradient(145deg, var(--right), #a396ff);
    color:white;
  }
</style>
</head>
<body>

<div id="homeScreen" class="screen active">
  <div class="floatArrow" style="top:12%; left:10%; background:var(--up); transform:rotate(20deg);"></div>
  <div class="floatArrow" style="top:22%; right:8%; background:var(--down); transform:rotate(-30deg);"></div>
  <div class="floatArrow" style="bottom:14%; left:14%; background:var(--left); transform:rotate(60deg);"></div>
  <div class="floatArrow" style="bottom:20%; right:12%; background:var(--right); transform:rotate(-10deg);"></div>

  <div class="home-logo"><div class="arrow-icon"></div></div>
  <h1 class="home-title">Arrow<span>ly</span></h1>
  <p class="home-sub">TAP · CLEAR · ESCAPE</p>

  <div class="home-actions">
    <button class="home-btn primary" id="playBtn">Play</button>
    <button class="home-btn secondary" id="levelsBtn">Levels</button>
  </div>

  <div class="home-progress" id="homeProgress">Level 1 unlocked</div>
</div>

<div id="gameScreen" class="screen">
  <header>
    <button class="homeBtn" id="homeBtn">⌂</button>
    <div class="brand">Arrow<span>ly</span></div>
    <div class="stats">
      <div class="pill"><small>LVL</small> <span id="levelNum">1</span></div>
      <div class="pill"><small>LEFT</small> <span id="remainingNum">0</span></div>
      <div class="pill"><small>MOVES</small> <span id="movesNum">0</span></div>
    </div>
  </header>

  <div id="boardWrap">
    <div id="board"></div>
  </div>

  <footer>
    <button class="btn" id="restartBtn">Restart</button>
    <button class="btn primary" id="newBtn">New Board</button>
  </footer>
</div>

<div id="levelOverlay">
  <div class="modal">
    <h2>Select Level</h2>
    <p>Tap any unlocked level to jump right in.</p>
    <div class="level-grid" id="levelGrid"></div>
    <button class="btn closeModalBtn" id="closeLevelOverlay">Close</button>
  </div>
</div>

<div id="overlay">
  <div class="modal">
    <h2 id="modalTitle">Level Cleared!</h2>
    <p id="modalText">Nice work — every arrow found its way out.</p>
    <button class="btn primary" id="nextBtn">Next Level</button>
    <button class="btn" id="modalHomeBtn">Back to Home</button>
  </div>
</div>

<script>
(function(){
  const LEVELS = [
    {rows:5, cols:5, density:0.55},
    {rows:5, cols:6, density:0.58},
    {rows:6, cols:6, density:0.6},
    {rows:6, cols:7, density:0.62},
    {rows:7, cols:7, density:0.63},
    {rows:7, cols:8, density:0.64},
    {rows:8, cols:8, density:0.66},
  ];
  const MAX_LEVEL_GRID = 20;

  // ---------- persistence ----------
  function loadUnlocked(){
    const v = parseInt(localStorage.getItem('arrowly_unlocked') || '1', 10);
    return isNaN(v) ? 1 : v;
  }
  function saveUnlocked(v){ localStorage.setItem('arrowly_unlocked', String(v)); }
  function loadBest(){
    try{ return JSON.parse(localStorage.getItem('arrowly_best') || '{}'); }catch(e){ return {}; }
  }
  function saveBest(obj){ localStorage.setItem('arrowly_best', JSON.stringify(obj)); }

  let unlockedLevel = loadUnlocked();
  let bestMoves = loadBest();

  // ---------- screens ----------
  const homeScreen = document.getElementById('homeScreen');
  const gameScreen = document.getElementById('gameScreen');
  function showScreen(name){
    homeScreen.classList.toggle('active', name==='home');
    gameScreen.classList.toggle('active', name==='game');
  }

  function updateHomeProgress(){
    document.getElementById('homeProgress').innerHTML = 'Level <b>' + unlockedLevel + '</b> unlocked';
  }

  // ---------- game state ----------
  const boardEl = document.getElementById('board');
  const levelNumEl = document.getElementById('levelNum');
  const remainingNumEl = document.getElementById('remainingNum');
  const movesNumEl = document.getElementById('movesNum');
  const overlay = document.getElementById('overlay');
  const modalTitle = document.getElementById('modalTitle');
  const modalText = document.getElementById('modalText');

  let level = 1;
  let rows, cols;
  let board = {};
  let moves = 0;
  let startBoardSnapshot = {};

  const DIRS = ['up','down','left','right'];
  const DELTA = { up:[-1,0], down:[1,0], left:[0,-1], right:[0,1] };

  function shuffle(arr){
    for(let i=arr.length-1;i>0;i--){
      const j = Math.floor(Math.random()*(i+1));
      [arr[i],arr[j]] = [arr[j],arr[i]];
    }
    return arr;
  }

  function pathClear(r,c,dir,rows,cols,state){
    const [dr,dc] = DELTA[dir];
    let rr=r+dr, cc=c+dc;
    while(rr>=0 && rr<rows && cc>=0 && cc<cols){
      if(state[rr+','+cc]) return false;
      rr+=dr; cc+=dc;
    }
    return true;
  }

  function generateLevel(rows, cols, density){
    const cells = [];
    for(let r=0;r<rows;r++) for(let c=0;c<cols;c++) cells.push([r,c]);
    shuffle(cells);
    const count = Math.max(4, Math.floor(rows*cols*density));
    const positions = cells.slice(0, count);
    const placed = {};
    const dirs = new Array(count).fill(null);
    for(let i=count-1; i>=0; i--){
      const [r,c] = positions[i];
      const valid = DIRS.filter(d => pathClear(r,c,d,rows,cols,placed));
      const dir = valid.length ? valid[Math.floor(Math.random()*valid.length)] : DIRS[Math.floor(Math.random()*4)];
      dirs[i] = dir;
      placed[r+','+c] = dir;
    }
    const result = {};
    for(let i=0;i<count;i++){
      const [r,c] = positions[i];
      result[r+','+c] = dirs[i];
    }
    return result;
  }

  function cfgForLevel(lvl){
    const cfg = LEVELS[Math.min(lvl-1, LEVELS.length-1)];
    let r = cfg.rows, c = cfg.cols;
    let density = cfg.density;
    if(lvl > LEVELS.length){
      const extra = lvl - LEVELS.length;
      r = Math.min(9, cfg.rows + Math.floor(extra/3));
      c = Math.min(9, cfg.cols + Math.floor(extra/3));
      density = Math.min(0.7, density + 0.01*extra);
    }
    return {rows:r, cols:c, density};
  }

  function startLevel(lvl){
    level = lvl;
    const cfg = cfgForLevel(level);
    rows = cfg.rows; cols = cfg.cols;
    board = generateLevel(rows, cols, cfg.density);
    moves = 0;
    startBoardSnapshot = JSON.parse(JSON.stringify(board));
    render();
    updateStats();
    showScreen('game');
  }

  function render(){
    boardEl.style.setProperty('--aspect', cols+'/'+rows);
    boardEl.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
    boardEl.style.gridTemplateRows = `repeat(${rows}, 1fr)`;
    boardEl.innerHTML = '';
    for(let r=0;r<rows;r++){
      for(let c=0;c<cols;c++){
        const cell = document.createElement('div');
        cell.className = 'cell';
        const key = r+','+c;
        if(board[key]){
          const dir = board[key];
          const btn = document.createElement('button');
          btn.className = 'arrow ' + dir;
          const icon = document.createElement('span');
          icon.className = 'arrow-icon ' + dir;
          btn.appendChild(icon);
          btn.dataset.r = r;
          btn.dataset.c = c;
          btn.addEventListener('click', onArrowTap);
          cell.appendChild(btn);
        }
        boardEl.appendChild(cell);
      }
    }
  }

  function onArrowTap(e){
    const btn = e.currentTarget;
    const r = parseInt(btn.dataset.r), c = parseInt(btn.dataset.c);
    const key = r+','+c;
    const dir = board[key];
    if(!dir) return;

    moves++;
    updateStats();

    if(pathClear(r,c,dir,rows,cols,board)){
      delete board[key];
      btn.classList.add('leaving', 'clear-'+dir);
      btn.removeEventListener('click', onArrowTap);
      setTimeout(()=>{ btn.remove(); }, 280);
      updateStats();
      if(Object.keys(board).length === 0){
        setTimeout(onLevelComplete, 320);
      }
    } else {
      btn.classList.remove('blocked');
      void btn.offsetWidth;
      btn.classList.add('blocked');
    }
  }

  function updateStats(){
    levelNumEl.textContent = level;
    remainingNumEl.textContent = Object.keys(board).length;
    movesNumEl.textContent = moves;
  }

  function onLevelComplete(){
    if(!bestMoves[level] || moves < bestMoves[level]){
      bestMoves[level] = moves;
      saveBest(bestMoves);
    }
    if(level === unlockedLevel){
      unlockedLevel = level + 1;
      saveUnlocked(unlockedLevel);
      updateHomeProgress();
    }
    modalTitle.textContent = 'Level ' + level + ' Cleared!';
    modalText.textContent = 'Cleared in ' + moves + ' moves. Ready for the next one?';
    overlay.classList.add('show');
  }

  // ---------- level select ----------
  const levelOverlay = document.getElementById('levelOverlay');
  const levelGrid = document.getElementById('levelGrid');
  function buildLevelGrid(){
    levelGrid.innerHTML = '';
    const maxShow = Math.max(MAX_LEVEL_GRID, unlockedLevel + 3);
    for(let i=1;i<=maxShow;i++){
      const btn = document.createElement('button');
      const locked = i > unlockedLevel;
      btn.className = 'level-node' + (locked?' locked':'') + (i===unlockedLevel?' current':'');
      btn.textContent = i;
      if(!locked){
        btn.addEventListener('click', ()=>{
          levelOverlay.classList.remove('show');
          startLevel(i);
        });
      }
      levelGrid.appendChild(btn);
    }
  }

  // ---------- wiring ----------
  document.getElementById('playBtn').addEventListener('click', ()=>{
    startLevel(unlockedLevel);
  });
  document.getElementById('levelsBtn').addEventListener('click', ()=>{
    buildLevelGrid();
    levelOverlay.classList.add('show');
  });
  document.getElementById('closeLevelOverlay').addEventListener('click', ()=>{
    levelOverlay.classList.remove('show');
  });
  document.getElementById('homeBtn').addEventListener('click', ()=>{
    updateHomeProgress();
    showScreen('home');
  });
  document.getElementById('modalHomeBtn').addEventListener('click', ()=>{
    overlay.classList.remove('show');
    updateHomeProgress();
    showScreen('home');
  });
  document.getElementById('nextBtn').addEventListener('click', ()=>{
    overlay.classList.remove('show');
    startLevel(level + 1);
  });
  document.getElementById('restartBtn').addEventListener('click', ()=>{
    board = JSON.parse(JSON.stringify(startBoardSnapshot));
    moves = 0;
    render();
    updateStats();
  });
  document.getElementById('newBtn').addEventListener('click', ()=>{
    startLevel(level);
  });

  updateHomeProgress();
})();
</script>
</body>
</html>
